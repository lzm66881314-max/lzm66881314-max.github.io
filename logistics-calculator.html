<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark">M</span><span>美国物流报价助手</span></div>
      <span class="header-note">最新报价 · 逐渠道核算</span>
    </header>
    <section class="panel form-panel" aria-labelledby="form-title">
      <div class="section-head"><div><h1 id="form-title">美国物流渠道计算器</h1><p class="form-subtitle">输入包裹信息，快速核价</p></div><span class="unit-note">重量 KG · 尺寸 CM</span></div>
      <form id="quote-form">
        <div class="field-grid">
          <label class="field"><span>实际重量 <b>KG</b></span><input name="actual" type="number" min="0.01" step="any" placeholder="例如 4.54" required></label>
          <label class="field"><span>尺寸 <b>长*宽*高，CM</b></span><input name="dimensions" type="text" inputmode="decimal" placeholder="例如 50.5*46*22.5" required></label>
          <label class="field"><span>产品名称</span><input name="product" type="text" placeholder="例如 真皮手提包"></label>
          <label class="field"><span>产品类型</span><select name="productType"><option value="clothes">服装</option><option value="shoes">鞋子</option><option value="bags">包包</option><option value="jewelry">银饰珠宝</option><option value="other" selected>其他</option></select></label>
          <label class="field shoe-field" id="shoe-field" hidden><span>鞋盒数量</span><select name="shoeBox"><option value="single">单鞋盒</option><option value="double">双鞋盒</option><option value="multi">多双鞋</option></select></label>
          <label class="field"><span>美国 ZIP Code</span><input name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="例如 85367" required></label>
        </div>
        <div class="form-bottom"><p>小包专线准入：实际 ≤ 5KG、最长边 ≤ 50CM、三边和 ≤ 110CM</p><button type="submit">计算并推荐渠道</button></div>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>
    <section id="results" class="results" hidden aria-live="polite"></section>
    <footer>报价以配置文件中的表格为准 · 实际发货前请复核待确认规则</footer>
  </main>
  <script type="module">
const round = (n, digits = 2) => Number(n.toFixed(digits));
const number = value => Number(value);

function calculateUsps(input,channel,config,basics) {
  const {actual,length,width,height,productType,shoeBox} = input;
  const {volumeCm3,longest,sideSum,smallParcelEligible} = basics;
  const steps = [], issues = [];
  let status = 'valid';
  const pending = message => {issues.push(message); if(status==='valid') status='pending';};
  const unavailable = message => {issues.push(message); status='unavailable';};
  if (!smallParcelEligible) unavailable('不满足小包专线三项准入条件');
  if (actual <= 0.05) unavailable('USPS 报价从大于 0.05KG 开始');
  const volumeKg = volumeCm3 / channel.divisor;
  steps.push(`体积重量：${round(volumeCm3)} ÷ ${channel.divisor} = ${round(volumeKg,3)} KG`);
  let billableKg = Math.max(actual,volumeKg);
  if (productType==='shoes' && shoeBox!=='multi') {
    if (!config.shoe.girthFormula) {
      pending('单双鞋盒周长的计算公式待确认');
      billableKg = null;
    } else {
      const girth = config.shoe.girthFormula==='girth' ? longest+2*(sideSum-longest) : sideSum;
      billableKg = girth <= config.shoe.girthLimitCm ? actual : Math.max(actual,volumeKg);
      steps.push(`单双鞋盒周长 ${round(girth)}CM；${girth<=config.shoe.girthLimitCm?'免抛':'超过 90CM，按材积÷8000 计抛'}`);
    }
  } else steps.push(`实际与体积取较大值：${round(billableKg,3)} KG`);
  let tierKg = null, basePrice = null, total = null;
  if (billableKg != null) {
    tierKg = round(Math.ceil((billableKg-1e-9)/channel.weightRoundStepKg)*channel.weightRoundStepKg);
    steps.push(`计费重量向上进位 ${channel.weightRoundStepKg}KG：${tierKg} KG`);
    const band = channel.registrationBands.find(b=>actual>b.aboveKg && actual<=b.upToKg);
    if (!band) unavailable('实际重量没有对应的挂号费区间');
    if (tierKg>5) unavailable('计费重量超过 USPS 报价上限 5KG');
    if (band && tierKg<=5) {
      const freight=round(tierKg*channel.perKgPrice);
      basePrice=round(freight+band.fee);
      total=basePrice;
      steps.push(`运费：${tierKg} × ¥${channel.perKgPrice} = ¥${freight}`);
      steps.push(`实际重量 ${actual}KG 所在区间 (${band.aboveKg}, ${band.upToKg}]：挂号费 ¥${band.fee}/票`);
      steps.push(`合计：¥${freight} + ¥${band.fee} = ¥${total}（图中价格已完整）`);
    }
  }
  return {channel,status,issues,steps,volumeKg:round(volumeKg,3),
    billableKg:billableKg==null?null:round(billableKg,3),tierKg,basePrice,customsFee:0,total};
}

function calculate(input, config) {
  const {actual,length,width,height,zip,productType,shoeBox} = input;
  const volumeCm3 = length * width * height;
  const longest = Math.max(length,width,height);
  const sideSum = length + width + height;
  const smallParcelEligible = actual <= 5 && longest <= 50 && sideSum <= 110;
  const basics = {volumeCm3,longest,sideSum,smallParcelEligible};
  const results = config.channels.map(channel => {
    if (channel.pricingMode==='perKgPlusRegistration')
      return calculateUsps(input,channel,config,basics);
    const steps = [];
    const issues = [];
    let status = 'valid';
    const pending = message => { issues.push(message); if (status === 'valid') status = 'pending'; };
    const unavailable = message => { issues.push(message); status = 'unavailable'; };
    if (channel.tags.includes('smallParcel') && !smallParcelEligible) unavailable('不满足小包专线三项准入条件');
    if (channel.restrictedZones.length) {
      const zone = config.zipZones[zip];
      if (!zone) pending('该 ZIP 的承运商分区未确认');
      else if (channel.restrictedZones.includes(zone)) unavailable(`承运商 ${zone} 区禁发`);
    }
    let volumeKg = null;
    let billableKg = null;
    if (channel.divisor == null) {
      pending('体积除数未在报价表中写明');
      steps.push('体积重量：除数待确认');
    } else {
      volumeKg = volumeCm3 / channel.divisor;
      steps.push(`体积重量：${round(volumeCm3)} ÷ ${channel.divisor} = ${round(volumeKg,3)} KG`);
      const free = channel.mode === 'threshold' && actual <= channel.freeActualMax && volumeKg <= channel.freeVolumeMax;
      billableKg = free ? actual : Math.max(actual,volumeKg);
      steps.push(free
        ? `符合该渠道免抛门槛，按实际重量 ${actual} KG`
        : `实际与体积取较大值：${round(billableKg,3)} KG`);
    }
    if (productType === 'shoes' && shoeBox !== 'multi') {
      if (!config.shoe.girthFormula) {
        pending('鞋盒“周长”计算公式待确认');
        steps.push('单双鞋盒：周长 ≤ 90CM 免抛；超出按材积÷8000。周长公式尚未确定。');
        billableKg = null;
      } else {
        const girth = config.shoe.girthFormula === 'girth'
          ? longest + 2 * (sideSum - longest) : sideSum;
        billableKg = girth <= config.shoe.girthLimitCm
          ? actual : Math.max(actual,volumeCm3 / config.shoe.overLimitDivisor);
        steps.push(`鞋盒周长 ${round(girth)}CM；${girth <= 90 ? '免抛' : '材积÷8000 计抛'}`);
      }
    }
    if (billableKg != null && channel.minBillableKg != null) {
      billableKg = Math.max(billableKg,channel.minBillableKg);
      steps.push(`该渠道最低计费重量 ${channel.minBillableKg} KG`);
    }
    let tierKg = null;
    let basePrice = null;
    if (billableKg != null) {
      tierKg = round(Math.ceil((billableKg - 1e-9) / config.weightStepKg) * config.weightStepKg);
      steps.push(`向上匹配报价表 ${config.weightStepKg} KG 档：${tierKg} KG`);
      basePrice = channel.prices[String(tierKg)] ?? null;
      if (basePrice == null) unavailable(`报价表 ${tierKg} KG 档无价格`);
      else steps.push(`报价表基础运费：¥${basePrice}`);
    }
    let customsFee = null;
    if (channel.customs === 'included') {
      customsFee = 0;
      steps.push('双清已含：¥0');
    } else if (channel.customs === 'extra') {
      if (channel.customsIncludedFromKg != null && tierKg != null && tierKg >= channel.customsIncludedFromKg) {
        customsFee = 0;
        steps.push(`${channel.customsIncludedFromKg}KG 档起报价已含双清：附加费 ¥0`);
      } else if (!channel.customsWeightBasis) pending('双清 ¥8/KG 的计重基数待确认');
      else if (billableKg != null) {
        const basis = channel.customsWeightBasis === 'actual' ? actual : tierKg;
        customsFee = round(basis * channel.customsYuanPerKg);
        steps.push(`双清：${basis} × ¥${channel.customsYuanPerKg} = ¥${customsFee}`);
      }
    } else pending('双清费用未提供');
    const total = basePrice != null && customsFee != null ? round(basePrice + customsFee) : null;
    if (total != null) steps.push(`合计：¥${basePrice} + ¥${customsFee} = ¥${total}`);
    return {channel,status,issues,steps,volumeKg:volumeKg == null ? null : round(volumeKg,3),
      billableKg:billableKg == null ? null : round(billableKg,3),tierKg,basePrice,customsFee,total};
  });
  return {basics,results};
}

function recommend(calculation) {
  const valid = calculation.results.filter(r => r.status === 'valid' && r.total != null);
  const byPrice = [...valid].sort((a,b) => a.total-b.total);
  const chosen = [];
  const add = (item,reason) => {
    if (item && !chosen.some(x => x.result.channel.id === item.channel.id))
      chosen.push({result:item,reason});
  };
  const small = calculation.basics.smallParcelEligible
    ? byPrice.find(r => r.channel.tags.includes('smallParcel')) : null;
  add(small ?? byPrice[0],small ? '符合小包准入，优先推荐专线' : '当前可核价渠道中运费最低');
  add(valid.find(r => r.channel.id === 'shenzhen-fedex'),
    '深圳联邦，报价表预计约 7 天');
  const bulky = byPrice.find(r => r.channel.tags.includes('bulky'));
  add(bulky, '大体积轻货方向，在可核价的 UPS-F 渠道中运费最低');
  for (const result of byPrice) {
    if (chosen.length >= 3) break;
    add(result,'补充可核价渠道，供比较');
  }
  return chosen.slice(0,3);
}

function validateInput(raw) {
  const actual=number(raw.actual);
  if (!Number.isFinite(actual) || actual <= 0) return '实际重量必须大于 0';
  if (!parseDimensions(raw.dimensions)) return '尺寸请输入 长*宽*高，例如 50.5*46*22.5';
  if (!/^\d{5}$/.test(raw.zip)) return '请输入 5 位美国 ZIP Code';
  return null;
}

function parseDimensions(value) {
  const match=String(value ?? '').trim().match(/^(\d+(?:\.\d+)?)\s*[*×xX＊]\s*(\d+(?:\.\d+)?)\s*[*×xX＊]\s*(\d+(?:\.\d+)?)$/);
  if (!match) return null;
  const [length,width,height]=match.slice(1).map(Number);
  return [length,width,height].every(n=>Number.isFinite(n)&&n>0) ? {length,width,height} : null;
}


const form = document.querySelector('#quote-form');
const resultsEl = document.querySelector('#results');
const errorEl = document.querySelector('#error');
const shoeField = document.querySelector('#shoe-field');

typeField.addEventListener('change', () => {shoeField.hidden = typeField.value !== 'shoes';});
const escapeHtml = value => String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money = value => `¥${Number(value).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}`;
const label = (id,index) => id === 'small-parcel-line' ? '便宜优先 · 小包专线' : index === 0 ? '便宜优先' : id === 'shenzhen-fedex' ? '时效优先' : ['malaysia-ups-f','singapore-ups-f','air-ups-f'].includes(id) ? '大体积轻货' : '可核价备选';

form.addEventListener('submit', event => {
  event.preventDefault();
  if (!config) return;
  const fd = new FormData(form);
  const input = Object.fromEntries(fd.entries());
  const error = validateInput(input);
  errorEl.hidden = !error;
  if (error) {errorEl.textContent = error; return;}
  input.actual = Number(input.actual);
  Object.assign(input,parseDimensions(input.dimensions));
  const calc = calculate(input,config);
  const picks = recommend(calc);
  const pending = calc.results.filter(r=>r.status !== 'valid');
  const facts = calc.basics;
  const cards = picks.map(({result:r,reason},index)=>`
    <article class="result-card">
      <div class="card-top"><span class="rank">${escapeHtml(label(r.channel.id,index))}</span><span class="valid-dot">已核价</span></div>
      <h3>${escapeHtml(r.channel.name)}</h3>
      <div class="price">${money(r.total)} <small>人民币 / 票</small></div>
      <div class="card-stats"><div><span>计费重量</span><strong>${r.tierKg} KG</strong></div><div><span>预计时效</span><strong>${escapeHtml(r.channel.eta)}</strong></div></div>
      <p class="reason">${escapeHtml(reason)}</p>
      <details><summary>查看计算过程</summary><ol>${r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol></details>
    </article>`).join('');
  resultsEl.innerHTML = `
    <div class="section-head results-head"><div><span class="kicker">02 / 计算结果</span><h2>渠道推荐</h2></div><span class="result-count">${picks.length} 个有效渠道</span></div>
    <div class="summary-strip">
      <span><small>包裹体积</small><strong>${round(facts.volumeCm3).toLocaleString('zh-CN')} CM³</strong></span>
      <span><small>最长边 / 三边和</small><strong>${round(facts.longest)} / ${round(facts.sideSum)} CM</strong></span>
      <span><small>小包专线</small><strong class="${facts.smallParcelEligible?'eligible':'ineligible'}">${facts.smallParcelEligible?'符合尺寸重量条件':'不符合准入条件'}</strong></span>
    </div>
    ${picks.length ? `<div class="cards">${cards}</div>` : '<div class="empty">当前没有能完整核价的渠道。请先补齐待确认规则和对应重量档价格。</div>'}
    <details class="audit"><summary>查看未入选渠道及待确认项（${pending.length}）</summary>
      <div class="audit-list">${pending.map(r=>`<div class="audit-row"><strong>${escapeHtml(r.channel.name)}</strong><span>${r.status==='unavailable'?'不可用':'待确认'}</span><p>${escapeHtml(r.issues.join('；'))}</p></div>`).join('')}</div>
    </details>
    <p class="source-note">依据：${escapeHtml(config.source.file)}、USPS 小包报价图 · 报价表空白档位不补价</p>
  `;
  resultsEl.hidden = false;
  resultsEl.scrollIntoView({behavior:'smooth',block:'start'});
});
