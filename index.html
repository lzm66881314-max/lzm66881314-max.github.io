<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <title>利润计算器</title>
  <style>
    :root{--ink:#1d201b;--muted:#707369;--paper:#f5f3ec;--line:#deddd5;--green:#1f644b;--soft:#d8eadf;--loss:#ff9f85}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100svh;padding:32px 15px;background:linear-gradient(#1d201b08 1px,transparent 1px),linear-gradient(90deg,#1d201b08 1px,transparent 1px);background-size:28px 28px}.wrap{width:min(1060px,100%);margin:auto}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.15em}.hero h1{margin:10px 0 8px;font:500 clamp(42px,8vw,64px)/1 Georgia,serif;letter-spacing:-.04em}.hero p{color:var(--muted);font-size:14px;margin:0 0 28px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{border-radius:23px;padding:28px;border:1px solid #1d201b18;box-shadow:0 18px 50px #322f2614}.input{background:#fffffff0}.result{background:var(--ink);color:#fff;min-height:520px;display:flex;flex-direction:column}.head{display:flex;gap:12px;margin-bottom:25px}.step{border:1px solid var(--line);border-radius:20px;padding:6px 11px;height:27px;font:700 11px monospace}.result .step{border-color:#ffffff38}.head h2{font-size:18px;margin:1px 0 3px}.head p{font-size:11px;color:var(--muted);margin:0}.result .head p{color:#ffffff82}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:block;font-size:13px;font-weight:700}.field>span{display:block;margin:0 0 8px 2px}.box{height:62px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px}.box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #1f644b1a}.box b{color:var(--green);font:500 21px Georgia}.box input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:22px;font-weight:700}.box small{color:#999;font-size:10px}.sale{margin-top:19px}.sale-row{display:grid;grid-template-columns:1fr auto;gap:9px}.tabs{display:flex;background:#e9e8e1;padding:5px;border-radius:14px}.tabs button{border:0;background:transparent;min-width:53px;border-radius:10px;color:#777;font-size:12px;font-weight:800}.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px #1d201b12}.notice{display:none;margin-top:14px;padding:12px;border-radius:11px;background:#fff2d1;color:#715619;font-size:12px}.rates{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.rates summary{display:flex;justify-content:space-between;font-weight:800;font-size:13px;cursor:pointer}.badge{color:var(--green);background:var(--soft);border-radius:20px;padding:5px 9px;font-size:10px}.hint{font-size:11px;color:var(--muted)}.rate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rate{background:#f2f1eb;padding:9px;border-radius:10px}.rate span{display:block;color:var(--muted);font-size:10px;font-weight:800}.rate input{width:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:700}.empty{margin:auto;text-align:center;color:#ffffff70;max-width:280px}.empty b{display:grid;place-items:center;width:82px;height:82px;margin:0 auto 20px;border:1px solid #ffffff2e;border-radius:50%;font:500 30px Georgia}.empty h3{color:#fff;font:500 23px Georgia;margin:0 0 8px}.profit-label{color:#ffffff91;font-size:12px}.profit{font:500 clamp(38px,5vw,53px) Georgia;margin:7px 0}.state{display:inline-block;background:var(--soft);color:var(--green);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:900}.loss .profit{color:var(--loss)}.loss .state{background:#f7ded6;color:#a93f25}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:25px;border-block:1px solid #ffffff20}.metrics div{padding:18px 10px;border-right:1px solid #ffffff20}.metrics div:last-child{border:0}.metrics span,.break span{display:block;color:#ffffff79;font-size:10px;margin-bottom:6px}.metrics strong{font-size:14px}.break{margin-top:20px;padding:17px;border:1px solid #ffffff22;border-radius:13px;background:#ffffff0d}.break strong{font:500 26px Georgia}.break small{display:block;color:#ffffff70;font-size:10px;margin-top:5px}.clear{margin-top:auto;height:47px;border:1px solid #ffffff2e;border-radius:12px;color:#fff;background:transparent;font-weight:700}.clear:disabled{opacity:.25}footer{text-align:center;color:#92948b;font-size:10px;margin-top:20px}@media(max-width:760px){.page{padding-top:25px}.grid{grid-template-columns:1fr}.card{padding:21px}.result{min-height:470px}.hero h1{font-size:45px}}@media(max-width:440px){.sale-row{grid-template-columns:1fr}.tabs{height:48px}.tabs button{flex:1}.rate-grid{grid-template-columns:1fr}.rate{display:grid;grid-template-columns:65px 1fr}.metrics{grid-template-columns:1fr 1fr}.metrics div:nth-child(2){border:0}.metrics div:last-child{grid-column:1/-1;border-top:1px solid #ffffff20}}
  </style>
</head>
<body>
  <main class="page"><div class="wrap">
    <header class="hero"><div class="eyebrow">— PRICING STUDIO</div><h1>利润计算器</h1><p>把成本和售价放在一起，找到刚刚好的定价。</p></header>
    <div class="grid">
      <section class="card input"><div class="head"><span class="step">01</span><div><h2>输入价格</h2><p>金额可以使用小数</p></div></div>
        <div class="two"><label class="field"><span>拿货价</span><div class="box"><b>¥</b><input id="cost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1200"><small>CNY</small></div></label><label class="field"><span>运费</span><div class="box"><b>¥</b><input id="shipping" type="number" min="0" step="0.01" inputmode="decimal" placeholder="400"><small>CNY</small></div></label></div>
        <label class="field sale"><span>预计售价</span><div class="sale-row"><div class="box"><b id="symbol">$</b><input id="sale" type="number" min="0" step="0.01" inputmode="decimal" placeholder="299"></div><div class="tabs"><button class="on" data-c="USD">USD</button><button data-c="EUR">EUR</button><button data-c="GBP">GBP</button></div></div></label>
        <div class="notice" id="notice">请先填写当前币种的人民币汇率，本机会自动记住。</div>
        <details class="rates"><summary><span>汇率设置</span><span class="badge" id="badge">1 USD = — CNY</span></summary><p class="hint">输入 1 单位外币可兑换多少人民币</p><div class="rate-grid"><label class="rate"><span>$ USD</span><input id="USD" type="number" min="0.0001" step="0.0001" placeholder="输入汇率"></label><label class="rate"><span>€ EUR</span><input id="EUR" type="number" min="0.0001" step="0.0001" placeholder="输入汇率"></label><label class="rate"><span>£ GBP</span><input id="GBP" type="number" min="0.0001" step="0.0001" placeholder="输入汇率"></label></div></details>
      </section>
      <section class="card result" id="result"><div class="head"><span class="step">02</span><div><h2>定价结果</h2><p id="subtitle">完成输入后实时计算</p></div></div><div id="output" class="empty"><b>¥</b><h3>等待计算</h3><span>填写成本、售价和当前币种汇率。</span></div><button id="clear" class="clear" disabled>清空本次输入</button></section>
    </div><footer>汇率仅保存在当前设备 · 金额均为单件计算</footer>
  </div></main>
  <script>
    const $=id=>document.getElementById(id), symbols={USD:'$',EUR:'€',GBP:'£'};let currency='USD';
    let rates={USD:'',EUR:'',GBP:''};try{rates={...rates,...JSON.parse(localStorage.getItem('profit-rates-v1')||'{}')}}catch(e){}
    Object.keys(rates).forEach(k=>$(k).value=rates[k]);
    const val=id=>{const s=$(id).value;if(s==='')return null;const n=Number(s);return Number.isFinite(n)&&n>=0?n:null};
    const money=(n,c='CNY')=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:c,minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
    function render(){const cost=val('cost'),ship=val('shipping'),sale=val('sale'),rate=val(currency);$('badge').textContent=`1 ${currency} = ${$(currency).value||'—'} CNY`;$('notice').style.display=(!rate||rate<=0)?'block':'none';$('clear').disabled=!$('cost').value&&!$('shipping').value&&!$('sale').value;if(cost===null||ship===null||sale===null||!rate){$('result').className='card result';$('subtitle').textContent='完成输入后实时计算';$('output').className='empty';$('output').innerHTML='<b>¥</b><h3>等待计算</h3><span>填写成本、售价和当前币种汇率。</span>';return}const total=cost+ship,revenue=sale*rate,profit=revenue-total,margin=revenue?profit/revenue*100:null,be=total/rate,state=Math.abs(profit)<.005?'even':profit>0?'profit':'loss';$('result').className='card result '+state;$('subtitle').textContent=state==='loss'?'当前定价会亏损':state==='even'?'当前定价刚好保本':'当前定价有利润';$('output').className='';$('output').innerHTML=`<span class="profit-label">预计利润</span><div class="profit">${profit>0?'+':''}${money(Math.abs(profit)<.005?0:profit)}</div><span class="state">${state==='loss'?'亏损':state==='even'?'保本':'盈利'}</span><div class="metrics"><div><span>折合收入</span><strong>${money(revenue)}</strong></div><div><span>总成本</span><strong>${money(total)}</strong></div><div><span>利润率</span><strong>${margin===null?'—':margin.toFixed(2)+'%'}</strong></div></div><div class="break"><span>保本售价</span><strong>${money(be,currency)}</strong><small>低于这个价格将会亏损</small></div>`}
    ['cost','shipping','sale','USD','EUR','GBP'].forEach(id=>$(id).addEventListener('input',()=>{if(id.length===3){rates[id]=$(id).value;try{localStorage.setItem('profit-rates-v1',JSON.stringify(rates))}catch(e){}}render()}));
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{currency=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));$('symbol').textContent=symbols[currency];render()});
    $('clear').onclick=()=>{['cost','shipping','sale'].forEach(id=>$(id).value='');render()};render();
  </script>
</body>
</html>
